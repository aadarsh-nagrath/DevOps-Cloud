<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps & Cloud Notes Hub</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Prismjs Theme -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i class="fa-solid fa-cloud-sun"></i>
          <span>DevOps Cloud Hub</span>
        </div>
        <p class="subtitle">Personal Learning Dashboard</p>
      </div>

      <button type="button" class="search-trigger" id="search-trigger" title="Search all notes">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Search all notes…</span>
        <kbd class="kbd-hint">⌘K</kbd>
      </button>

      <a href="#Index.md" id="index-pin" class="tree-file index-pin" style="display: none;">
        <i class="fa-solid fa-map icon-index file-icon"></i> <span>Index</span>
      </a>

      <nav class="notes-tree" id="notes-tree">
        <!-- Tree content injected by JS -->
        <div class="loader-container">
          <div class="loader"></div>
        </div>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="content-header">
        <div class="header-left">
          <button id="toggle-sidebar" class="icon-btn" title="Toggle Sidebar">
            <i class="fa-solid fa-bars-staggered"></i>
          </button>
          <div class="breadcrumbs" id="breadcrumbs">
            <span>Select a note to start reading</span>
          </div>
        </div>
        <div class="header-right" style="display: flex; gap: 12px;">
          <button id="header-search" class="icon-btn" title="Search all notes (⌘K or /)">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
          <a href="https://github.com/aadarsh-nagrath/DevOps-Cloud" target="_blank" class="icon-btn" title="Contribute on GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
          <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
      </header>

      <!-- Viewer Frame -->
      <section class="viewer-body">
        <div class="welcome-screen" id="welcome-screen">
          <div class="welcome-card">
            <div class="pulse-icon">
              <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1>Welcome to your DevOps Hub</h1>
            <p>Select any markdown note from the sidebar to view detailed reference guides, scripts, and configurations.</p>
            <div class="stats-box">
              <div class="stat-item">
                <span class="stat-num" id="total-notes-count">0</span>
                <span class="stat-lbl">Notes Available</span>
              </div>
            </div>
          </div>
        </div>

        <div class="markdown-container" id="markdown-container" style="display: none;">
          <article id="note-content" class="markdown-body">
            <!-- Rendered note content -->
          </article>
        </div>
      </section>

      <!-- In-note match navigator, shown after opening a search result -->
      <div class="find-bar" id="find-bar" hidden>
        <i class="fa-solid fa-magnifying-glass"></i>
        <span class="find-query" id="find-query"></span>
        <span class="find-count" id="find-count"></span>
        <button type="button" class="find-btn" id="find-prev" title="Previous match (Shift+Enter)"><i class="fa-solid fa-chevron-up"></i></button>
        <button type="button" class="find-btn" id="find-next" title="Next match (Enter)"><i class="fa-solid fa-chevron-down"></i></button>
        <button type="button" class="find-btn" id="find-close" title="Clear highlights (Esc)"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </main>
  </div>

  <!-- Full-text search palette -->
  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search all notes">
      <div class="search-input-row">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Search every note… e.g. df -i, &quot;blue-green&quot;, OOMKilled" autocomplete="off" spellcheck="false">
        <button type="button" class="clear-btn" id="search-clear" title="Clear" hidden><i class="fa-solid fa-xmark"></i></button>
        <button type="button" class="search-esc" id="search-close" title="Close (Esc)">Esc</button>
      </div>
      <div class="search-scopes" id="search-scopes" role="tablist">
        <button type="button" class="scope-chip active" data-scope="all">All</button>
        <button type="button" class="scope-chip" data-scope="notes">Notes</button>
        <button type="button" class="scope-chip" data-scope="qna">Interview Q&amp;A</button>
        <button type="button" class="scope-chip" data-scope="cka">CKA</button>
        <span class="search-status" id="search-status"></span>
      </div>
      <div class="search-results" id="search-results" role="listbox"></div>
      <div class="search-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>"…"</kbd> exact phrase</span>
        <span><kbd>Esc</kbd> close</span>
      </div>
    </div>
  </div>

  <!-- CDN scripts -->
  <!-- Marked.js (Markdown parser) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Prism.js (Syntax highlighters) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <!-- Prism Language components for DevOps/Cloud tools -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-docker.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-hcl.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-ini.min.js"></script>
  
  <!-- Mermaid (flow diagrams in ```mermaid blocks) -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>

  <script src="app.js"></script>
  <script src="search.js"></script>
</body>
</html>
